<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Parallelogram Angle Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --foreground: #1a1c1f;
      --border: #d1d5db;
      --viz-series-1: #2563eb;
      --red: #c00000;
      background: #ffffff;
    }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #ffffff;
    }
    body {
      box-sizing: border-box;
      padding: 16px;
    }
    .viz-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      appearance: auto;
      min-height: 30px;
      padding: 4px 10px;
      color: #1a1c1f;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .btn:hover {
      background: #e5e7eb;
    }
    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }
    a {
      color: #2563a8;
    }
    @media (max-width: 600px) {
      body {
        padding: 0;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
<div id="parallelogram-angle-explorer">
  <style>
    #parallelogram-angle-explorer {
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 0 auto;
    }
    #parallelogram-angle-explorer * { box-sizing: border-box; }
    #parallelogram-angle-explorer h2 {
      font-size: 17px;
      line-height: 1.25;
      margin: 0 0 14px;
    }
    #parallelogram-angle-explorer .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px 22px;
      margin-bottom: 10px;
    }
    #parallelogram-angle-explorer label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    #parallelogram-angle-explorer label span {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    #parallelogram-angle-explorer output {
      font-variant-numeric: tabular-nums;
      color: var(--viz-series-1);
      font-size: 11px;
      font-weight: 400;
    }
    #parallelogram-angle-explorer input[type="range"] {
      width: 100%;
      accent-color: var(--viz-series-1);
    }
    #parallelogram-angle-explorer svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 780px;
    }
    #parallelogram-angle-explorer .page { fill: #ffffff; stroke: var(--border); }
    #parallelogram-angle-explorer .shape { fill: none; stroke: #111111; stroke-width: 2.2; }
    #parallelogram-angle-explorer .angle-arc { fill: none; stroke: #d06418; stroke-width: 2.2; }
    #parallelogram-angle-explorer .inset-segment {
      fill: none;
      stroke: #258a53;
      stroke-width: 1.1;
      stroke-dasharray: 6 5;
    }
    #parallelogram-angle-explorer .inset-offset {
      fill: none;
      stroke: #258a53;
      stroke-width: 1.2;
    }
    #parallelogram-angle-explorer .top-dimension-extension {
      fill: none;
      stroke: #777777;
      stroke-width: 1;
    }
    #parallelogram-angle-explorer .static-line {
      fill: none;
      stroke: #6a3d12;
      stroke-width: 1.5;
    }
    #parallelogram-angle-explorer .static-line-label {
      fill: #6a3d12;
      font-size: 11px;
      font-weight: 400;
    }
    #parallelogram-angle-explorer .overlap-dimension {
      fill: none;
      stroke: #6a3d12;
      stroke-width: 1;
    }
    #parallelogram-angle-explorer .overlap-label {
      fill: var(--red);
      font-size: 11px;
      font-weight: 400;
    }
    #parallelogram-angle-explorer .label {
      fill: #111111;
      font-size: 11px;
      font-weight: 400;
      font-family: inherit;
      text-anchor: middle;
    }
    #parallelogram-angle-explorer .angle-label { fill: #a64a0d; font-weight: 400; }
    #parallelogram-angle-explorer .inset-label {
      fill: #1c6d43;
      font-size: 11px;
      font-weight: 400;
    }
    #parallelogram-angle-explorer text.overlap-label {
      fill: #c00000;
      text-anchor: end;
    }
    #parallelogram-angle-explorer text.emphasized-dimension-label {
      font-size: 13px;
      font-weight: 700;
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }
    #parallelogram-angle-explorer text.inside-measurement-label {
      font-weight: 700;
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }
    #parallelogram-angle-explorer .right-angle-method {
      stroke: #7030a0;
    }
    #parallelogram-angle-explorer text.right-angle-method-label {
      fill: #7030a0;
    }
    #parallelogram-angle-explorer text.right-angle-method-title {
      font-weight: 700;
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
      text-anchor: end;
    }
    #parallelogram-angle-explorer .calculations {
      color: #111111;
      background: #ffffff;
      margin: 8px 0 10px;
    }
    #parallelogram-angle-explorer .calculations h3 {
      font-size: 15px;
      margin: 0 0 2px;
    }
    #parallelogram-angle-explorer .calculation-note {
      margin: 0 0 8px;
      color: #444444;
      font-size: 12px;
    }
    #parallelogram-angle-explorer .calculation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 18px;
    }
    #parallelogram-angle-explorer .calculation {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
    }
    #parallelogram-angle-explorer .calculation-name {
      font-weight: 700;
    }
    #parallelogram-angle-explorer .calculation-formula {
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      font-size: 13px;
      font-weight: 500;
    }
    #parallelogram-angle-explorer .calculation-result {
      margin-left: 4px;
      font-weight: 700;
    }
    #parallelogram-angle-explorer .calculation-green { color: #1c6d43; }
    #parallelogram-angle-explorer .calculation-purple { color: #7030a0; }
    #parallelogram-angle-explorer .calculation-brown { color: #6a3d12; }
    #parallelogram-angle-explorer .calculation-red { color: #c00000; }
    @media (max-width: 600px) {
      #parallelogram-angle-explorer {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 100vw;
        max-width: none;
        height: 100vh;
        height: 100svh;
        height: 100dvh;
        min-height: 0;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
        padding: 8px 8px 12px;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #parallelogram-angle-explorer h2 {
        order: 0;
        flex: 0 0 auto;
        font-size: 15px;
        margin-bottom: 6px;
      }
      #parallelogram-angle-explorer #pae-svg {
        order: 1;
        flex: 1 1 0;
        min-height: 0;
        height: 100%;
        max-height: none;
      }
      #parallelogram-angle-explorer .controls {
        order: 3;
        flex: 0 0 auto;
        margin: 8px 0 6px;
      }
      #parallelogram-angle-explorer #pae-calculations {
        order: 2;
        flex: 0 0 auto;
        margin: 5px 0;
      }
      #parallelogram-angle-explorer #pae-reset-row {
        order: 4;
        flex: 0 0 auto;
      }
      #parallelogram-angle-explorer #pae-source-footer {
        order: 5;
        flex: 0 0 auto;
        margin-top: 6px;
      }
      #parallelogram-angle-explorer .calculation-grid {
        grid-template-columns: 1fr;
        gap: 2px;
      }
      #parallelogram-angle-explorer .calculation {
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 6px;
      }
      #parallelogram-angle-explorer .calculation-formula {
        font-size: 12px;
      }
    }
  </style>

  <h2>PARALLELOGRAM ANGLE EXPLORER</h2>
  <div class="controls">
    <label>
      <span>Slant angle θ <output id="pae-angle-output">69.69°</output></span>
      <input id="pae-angle" type="range" min="1" max="180" step="0.01" value="69.69" aria-label="Slant angle in degrees">
    </label>
  </div>
  <div id="pae-reset-row" class="viz-row">
    <button id="pae-snap-90" class="btn" type="button">Reset to 90°</button>
    <button id="pae-snap-11023" class="btn" type="button">Reset to 110.23°</button>
  </div>
  <svg id="pae-svg" viewBox="0 0 620 676" role="img" aria-labelledby="pae-svg-title pae-svg-desc">
    <title id="pae-svg-title">Interactive parallelogram geometry</title>
    <desc id="pae-svg-desc">Adjust the slant angle to see the linked geometry change. Purple right-angle dimensions show both edge insets and the span between the two inner green lines. Green dimensions show the fixed 15, 50, and 15 foot distances along the top edge. The lower guides measure A at 65 feet and B at 50 feet, with a live overlap measurement between their left endpoints.</desc>
    <defs>
      <marker id="pae-green-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#258a53"></path>
      </marker>
      <marker id="pae-purple-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#7030a0"></path>
      </marker>
      <marker id="pae-static-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6a3d12"></path>
      </marker>
    </defs>
    <g id="pae-diagram-scale" transform="translate(-93 0) scale(1.3)">
    <rect class="page" x="92" y="12" width="436" height="496" rx="2"></rect>
    <path id="pae-shape" class="shape"></path>
    <line id="pae-inset-left" class="inset-segment"></line>
    <line id="pae-inset-right" class="inset-segment"></line>
    <line id="pae-top-dim-left" class="inset-offset" marker-start="url(#pae-green-arrow)" marker-end="url(#pae-green-arrow)"></line>
    <line id="pae-top-dim-right" class="inset-offset" marker-start="url(#pae-green-arrow)" marker-end="url(#pae-green-arrow)"></line>
    <line id="pae-top-dim-inner" class="inset-offset" marker-start="url(#pae-green-arrow)" marker-end="url(#pae-green-arrow)"></line>
    <line id="pae-top-ext-left" class="top-dimension-extension"></line>
    <line id="pae-top-ext-inset-left" class="top-dimension-extension"></line>
    <line id="pae-top-ext-inset-right" class="top-dimension-extension"></line>
    <line id="pae-top-ext-right" class="top-dimension-extension"></line>
    <text id="pae-top-dim-left-label" class="label inset-label emphasized-dimension-label">15 ft</text>
    <text id="pae-top-dim-right-label" class="label inset-label emphasized-dimension-label">15 ft</text>
    <text id="pae-top-dim-inner-label" class="label inset-label emphasized-dimension-label">50 ft</text>
    <path id="pae-angle-arc" class="angle-arc"></path>
    <text id="pae-angle-label" class="label angle-label">69.69°</text>

    <line id="pae-perp-inset-left" class="inset-offset right-angle-method" marker-start="url(#pae-purple-arrow)" marker-end="url(#pae-purple-arrow)"></line>
    <line id="pae-perp-inner" class="inset-offset right-angle-method" marker-start="url(#pae-purple-arrow)" marker-end="url(#pae-purple-arrow)"></line>
    <line id="pae-perp-inset-right" class="inset-offset right-angle-method" marker-start="url(#pae-purple-arrow)" marker-end="url(#pae-purple-arrow)"></line>
    <path id="pae-perp-square-left" class="inset-offset right-angle-method"></path>
    <path id="pae-perp-square-right" class="inset-offset right-angle-method"></path>
    <text id="pae-right-angle-method-label" class="label right-angle-method-label right-angle-method-title">Right angle method</text>
    <text id="pae-perp-inset-left-label" class="label inset-label inside-measurement-label right-angle-method-label">14.07 ft</text>
    <text id="pae-perp-inner-label" class="label inset-label inside-measurement-label right-angle-method-label">46.88 ft</text>
    <text id="pae-perp-inset-right-label" class="label inset-label inside-measurement-label right-angle-method-label">14.07 ft</text>

    <line id="pae-static-a" class="static-line" marker-start="url(#pae-static-arrow)" marker-end="url(#pae-static-arrow)"></line>
    <text id="pae-static-a-label" class="label static-line-label">A · 65 ft</text>
    <line id="pae-static-b" class="static-line" marker-start="url(#pae-static-arrow)" marker-end="url(#pae-static-arrow)"></line>
    <text id="pae-static-b-label" class="label static-line-label">B · 50 ft</text>
    <line id="pae-overlap-span" class="overlap-dimension"></line>
    <line id="pae-overlap-extension" class="overlap-dimension"></line>
    <line id="pae-overlap-witness-a" class="overlap-dimension"></line>
    <text id="pae-overlap-label" class="label overlap-label emphasized-dimension-label">Overlap · 0.93 ft</text>

    <text id="pae-bottom-side-label" class="label">80 ft</text>
    <text id="pae-right-side-label" class="label">165.93 ft</text>
    </g>
  </svg>

  <section id="pae-calculations" class="calculations" aria-labelledby="pae-calculations-title">
    <h3 id="pae-calculations-title">Measurement calculations</h3>
    <div class="calculation-grid">
      <div class="calculation calculation-green">
        <span class="calculation-name">Shape</span>
        <span class="calculation-formula"><span id="pae-calc-shape-expression">Calculating…</span><strong id="pae-calc-shape-result" class="calculation-result"></strong></span>
      </div>
      <div class="calculation calculation-purple">
        <span class="calculation-name">Outer offsets</span>
        <span class="calculation-formula"><span id="pae-calc-perp-insets-expression">Calculating…</span><strong id="pae-calc-perp-insets-result" class="calculation-result"></strong></span>
      </div>
      <div class="calculation calculation-purple">
        <span class="calculation-name">Inner span</span>
        <span class="calculation-formula"><span id="pae-calc-perp-inner-expression">Calculating…</span><strong id="pae-calc-perp-inner-result" class="calculation-result"></strong></span>
      </div>
      <div class="calculation calculation-brown">
        <span class="calculation-name">A and B</span>
        <span class="calculation-formula"><span id="pae-calc-fixed-arrows-expression">Calculating…</span><strong id="pae-calc-fixed-arrows-result" class="calculation-result"></strong></span>
      </div>
      <div class="calculation calculation-red">
        <span class="calculation-name">Overlap</span>
        <span class="calculation-formula"><span id="pae-calc-overlap-expression">Calculating…</span><strong id="pae-calc-overlap-result" class="calculation-result"></strong></span>
      </div>
    </div>
  </section>

  <footer id="pae-source-footer" class="viz-row">
    <a href="https://github.com/cove/parallelogram-angle-explorer" target="_blank" rel="noopener noreferrer">Source Code</a>
  </footer>

  <script type="module" src="./main.mjs"></script>
</div>

</body>
</html>
